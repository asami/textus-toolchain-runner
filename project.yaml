project:
  name: "textus-toolchain-runner"
  title: "Textus Toolchain Runner"
  kind: car
  organization: "org.simplemodeling.textus"
  scalaPackage: "org.simplemodeling.textus.toolchainrunner"
  component:
    name: "textus-toolchain-runner"
    className: "ToolchainRunner"
    displayName: "Textus Toolchain Runner"
    version: "0.2.1-SNAPSHOT"
    config:
      textus.server.default-port: "18010"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.1-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.2-SNAPSHOT"
    test:
      - "org.scalatest::scalatest:3.2.19"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    manifest_metadata:
      boundedContext: "default"
      domain: "default"
    runtime:
      cncf:
        minimum: "0.5.2-SNAPSHOT"
        excluded: []
        tested:
          - "0.5.2-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-toolchain-runner"
